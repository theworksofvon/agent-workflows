# Toolchain, environment, and every developer command for this checkout.
# `mise install` puts the tools on PATH; `mise tasks` lists the commands;
# `mise run gate` is what CI runs.
#
# pnpm is pinned to the same release as package.json's `packageManager` so
# the version mise provides is the one pnpm would enforce anyway; keep the
# two in step when bumping.
[tools]
node = "24"
pnpm = "11.15.0"

[env]
# Local binaries (tsc, eslint, prettier, tsx) resolve without `pnpm exec`.
_.path = ["{{config_root}}/node_modules/.bin"]
# The app's own configuration, so one-off `node dist/main.js ...` calls in
# this shell see it. Silently skipped when the file does not exist. The app
# still loads .env itself, so `pnpm start` works outside this shell too.
_.file = ".env"

[tasks.deps]
description = "Install locked dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.setup]
description = "Install, build, and create .env on a fresh clone"
run = "node scripts/setup.mjs"

[tasks.doctor]
description = "Check this machine before starting the app"
run = "node scripts/doctor.mjs"

[tasks.build]
description = "Compile TypeScript and source maps into dist/"
run = "tsc"

[tasks.dev]
description = "Run the app from source with restart on change"
run = "tsx watch src/main.ts"

[tasks.typecheck]
description = "Typecheck production sources"
run = "tsc --noEmit"

[tasks."typecheck:tests"]
description = "Typecheck the test sources"
run = "tsc --project tsconfig.tests.json"

[tasks.lint]
run = "eslint src tests scripts eslint.config.js"

[tasks.format]
description = "Rewrite files with Prettier"
run = "prettier --write src tests scripts .github package.json tsconfig.json tsconfig.tests.json README.md docs"

[tasks."format:check"]
run = "prettier --check src tests scripts .github package.json tsconfig.json tsconfig.tests.json README.md docs"

[tasks."check:scripts"]
description = "Syntax-check the Node setup and doctor scripts"
run = "node --check scripts/setup.mjs && node --check scripts/doctor.mjs"

# The tests start the real app with a fake GitHub and a fake agent, and the
# app's coverage comes from those child processes. Branches sit lower than
# lines because some validation branches are reachable only with a broken
# GitHub or agent.
[tasks.test]
description = "Every test, with a coverage floor on src/"
run = 'node --import tsx --test --test-timeout=120000 --experimental-test-coverage --test-coverage-include="src/**/*.ts" --test-coverage-lines=90 --test-coverage-branches=65 --test-coverage-functions=90 "tests/**/*.test.ts"'

[tasks."test:smoke"]
description = "Exercise the compiled CLI help routes"
depends = ["build"]
run = "node dist/main.js --help && node dist/main.js help && node dist/main.js review --help && node dist/main.js start --help && node dist/main.js ui --help"

[tasks.start]
description = "Serve the guided review app and API on UI_HOST:UI_PORT (default 127.0.0.1:4773)"
alias = "ui"
depends = ["build"]
run = "node dist/main.js start"

[tasks."web:dev"]
description = "Run the guided review web app with hot reload against the app on port 4773"
run = "pnpm --dir web exec vite"

[tasks."web:build"]
description = "Build the guided review web app into web/dist"
run = "pnpm --dir web exec vite build"

[tasks."web:check"]
description = "Typecheck and build the guided review web app"
run = "pnpm --dir web exec tsc --noEmit && pnpm --dir web exec vite build"

[tasks."docker:build"]
description = "Build the Docker image (see README, Run with Docker)"
run = "docker compose build"

[tasks."docker:up"]
description = "Run the app in Docker on 127.0.0.1:HOST_PORT (default 4773)"
run = "docker compose up -d"

[tasks.gate]
description = "Everything CI checks; independent tasks run in parallel"
depends = [
  "typecheck",
  "typecheck:tests",
  "lint",
  "format:check",
  "check:scripts",
  "test",
  "test:smoke",
  "web:check",
]
