name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  quality:
    name: Quality and Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise run deps
      - name: Typecheck production
        run: mise run typecheck
      - name: Typecheck tests
        run: mise run typecheck:tests
      - name: Lint
        run: mise run lint
      - name: Check formatting
        run: mise run format:check
      - name: Check Node scripts
        run: mise run check:scripts
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run test:unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run test:integration

  coverage:
    name: Complete Runtime Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run test

  compiled-smoke:
    name: Compiled Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run test:smoke
